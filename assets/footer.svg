<svg width="1200" height="180" viewBox="0 0 1200 180"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>

    <linearGradient id="footerText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="180" fill="url(#footerBg)"/>

  <!-- Decorative circles -->
  <circle cx="80" cy="90" r="70"
          fill="#8B5CF6"
          opacity="0.08"/>

  <circle cx="1120" cy="90" r="70"
          fill="#22D3EE"
          opacity="0.08"/>

  <!-- Main text -->
  <text x="600" y="70"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="28"
        font-weight="bold"
        fill="url(#footerText)">
    Thanks for visiting my profile!
  </text>

  <!-- Subtitle -->
  <text x="600" y="105"
        text-anchor="middle"
        font-family="monospace"
        font-size="17"
        fill="#CBD5E1">
    Let's build something amazing together.
  </text>

  <!-- Code style -->
  <text x="600" y="140"
        text-anchor="middle"
        font-family="monospace"
        font-size="14"
        fill="#64748B">
    &lt;/&gt;  React • Next.js • Node.js • MongoDB
  </text>

</svg>
